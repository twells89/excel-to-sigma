name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q skills/excel-to-sigma/scripts skills/excel-to-sigma/tests
      - name: Unit tests
        run: python -m unittest discover -s skills/excel-to-sigma/tests -v
      - name: Workbook audit smoke
        working-directory: skills/excel-to-sigma/scripts
        run: |
          python make-sample-forecast.py
          python audit-xlsx.py "Sample Forecast.xlsx" --allow-review --out /tmp/sample-audit.json
      - name: Live Sigma OpenAPI drift audit
        working-directory: skills/excel-to-sigma/scripts
        run: python audit-openapi.py --out /tmp/sigma-openapi-audit.json
